# /etc/nginx/sites-available/app.unieval.in
# Nginx Configuration for UniEval Web App & API on VPS

server {
    listen 80;
    listen [::]:80;
    server_name app.unieval.in;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://app.unieval.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.unieval.in;

    # SSL Certificate (generated via: certbot --nginx -d app.unieval.in)
    ssl_certificate     /etc/letsencrypt/live/app.unieval.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.unieval.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "same-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Large uploads (video/notes)
    client_max_body_size 512m;
    client_body_timeout 300s;

    # ── 1. /api/ — Proxy to Node.js backend ──────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── 2. /uploads/ — Proxy to Node.js ──────────────────────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 3. Static assets from Vite build (dist/) ─────────────────────────
    root /home/ubuntu/UNIEVAL/dist;
    index index.html;

    # Cache hashed static assets forever
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── 4. SPA fallback — route all other requests to index.html ─────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/app.unieval.access.log;
    error_log  /var/log/nginx/app.unieval.error.log warn;
}
