# /etc/nginx/sites-available/unieval.in
# Simple, working config — fixes 404 on /api/ routes

server {
    listen 80;
    listen [::]:80;
    server_name unieval.in www.unieval.in;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://unieval.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.unieval.in;

    ssl_certificate     /etc/letsencrypt/live/unieval.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unieval.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://unieval.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name unieval.in;

    ssl_certificate     /etc/letsencrypt/live/unieval.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unieval.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "same-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Large uploads
    client_max_body_size 512m;
    client_body_timeout 300s;

    # ── /api/ and /uploads/ — proxy to Node FIRST (order matters) ──────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static assets from Vite build (dist/) ──────────────────────────────
    root /home/ubuntu/UNIEVAL/dist;
    index index.html;

    # Cache hashed assets forever
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — everything else serves index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/unieval.access.log;
    error_log  /var/log/nginx/unieval.error.log warn;
}